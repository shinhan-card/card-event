}

.gantt-container{overflow-x:auto;position:relative}
.gantt-header{display:flex;position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:2px solid var(--line)}
.gantt-header-cell{min-width:40px;text-align:center;font-size:.65rem;font-weight:600;color:var(--muted);padding:6px 2px;border-right:1px solid var(--line)}
.gantt-header-cell.today{background:#eff6ff;color:var(--brand);font-weight:700}
.gantt-row{display:flex;align-items:center;border-bottom:1px solid var(--line);min-height:32px;position:relative}
.gantt-label{width:200px;min-width:200px;padding:4px 8px;font-size:.72rem;font-weight:600;
  border-right:2px solid var(--line);background:var(--panel);position:sticky;left:0;z-index:3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gantt-cells{display:flex;flex:1;position:relative;min-height:28px}
.gantt-cell{min-width:40px;border-right:1px solid var(--line);height:100%}
.gantt-cell.today{background:rgba(59,130,246,.06)}
.gantt-cell.weekend{background:rgba(0,0,0,.02)}
[data-theme="dark"] .gantt-cell.weekend{background:rgba(255,255,255,.02)}
.gantt-bar{position:absolute;height:20px;top:4px;border-radius:4px;font-size:.6rem;
  color:#fff;font-weight:600;padding:0 6px;display:flex;align-items:center;
  cursor:pointer;transition:opacity .15s;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
  box-shadow:0 1px 3px rgba(0,0,0,.15)}
.gantt-bar:hover{opacity:.85;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.gantt-bar.samsung{background:linear-gradient(135deg,#3b82f6,#60a5fa)}
.gantt-bar.kb{background:linear-gradient(135deg,#f59e0b,#fbbf24)}
.gantt-bar.hyundai{background:linear-gradient(135deg,#374151,#6b7280)}
.gantt-bar.shinhan{background:linear-gradient(135deg,#ef4444,#f87171)}
.gantt-bar.default{background:linear-gradient(135deg,#6b7280,#9ca3af)}
.gantt-group-header{background:var(--brand-soft);font-weight:700;font-size:.75rem;
  padding:6px 10px;border-bottom:2px solid var(--line);color:var(--ink);cursor:pointer}
.gantt-group-header:hover{background:#d4e2ff}

.gantt-today-line{position:absolute;top:0;bottom:0;width:2px;background:var(--danger);z-index:4;pointer-events:none}

.side-panel{
  position:fixed;right:0;top:0;bottom:0;width:var(--side-w);max-width:100vw;
  background:var(--panel);border-left:1px solid var(--line);

function filterProducts() {
  const company = document.getElementById('prodFilterCompany').value;
  const type = document.getElementById('prodFilterType').value;
  const kw = (document.getElementById('prodFilterKw').value || '').toLowerCase();
  const sortBy = document.getElementById('prodSortBy').value;

  let filtered = window._ALL_PRODUCTS.filter(p => {
    if (company && p.company !== company) return false;
    if (type && p.card_type !== type) return false;
    if (kw && !(p.card_name||'').toLowerCase().includes(kw)) return false;
    return true;
  });

  if (sortBy === 'chunks') filtered.sort((a,b) => (b.chunk_count||0) - (a.chunk_count||0));
  else filtered.sort((a,b) => (a.card_name||'').localeCompare(b.card_name||''));

  const grid = document.getElementById('productGrid');
  const empty = document.getElementById('productEmpty');

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');

  grid.innerHTML = filtered.map(p => {
    const co = p.company || '';
    const chunks = p.chunk_count || 0;

function isGenericProductListingUrl(url) {
  if (!url) return true;
  return [
    '/MOBFM12051R01.shc',
    '/HSHMCXCRSZZC0002',
    '/CPUUG2001_04.hc'
  ].some(marker => url.includes(marker));

function openProductCard(encodedProduct) {
  if (!encodedProduct) return;
  let product = null;
  try {
    product = JSON.parse(decodeURIComponent(encodedProduct));
  } catch (_) {
    product = null;
  }
  if (!product) return;

  const detailUrl = product.url && !isGenericProductListingUrl(product.url) ? product.url : '';
  const localPdfUrl = product.local_pdf_url || (
    product.company && product.card_name
      ? `/api/rag/catalog/pdf?company=${encodeURIComponent(product.company)}&card_name=${encodeURIComponent(product.card_name)}`
      : ''
  );
  const directUrl = detailUrl || localPdfUrl || product.pdf_url || product.url || '';
  if (directUrl) {
    window.open(directUrl, '_blank', 'noopener,noreferrer');
    return;
  }

  const searchInput = document.getElementById('ragSearchInput');
  if (searchInput && product.card_name) {
    searchInput.value = product.card_name;
  }
  const searchTabBtn = document.querySelector('#tab-products [data-stab="product-search"]');
  if (searchTabBtn) {
    switchSubTab(searchTabBtn, 'products');
  }
  if (product.card_name) {
    executeRAGSearch();
  }
}

function renderGantt() {
  if (typeof ALL === 'undefined' || !ALL.length) {
    document.getElementById('ganttChart').innerHTML = '<p class="p-8 text-center text-slate-400">???????????????? ????????亦껋꼦維??????..</p>';

  const company = document.getElementById('ganttFilterCompany').value;

  // ???????????????嚥???癲?????욱룕???
  const daysInMonth = new Date(GANTT_YEAR, GANTT_MONTH + 1, 0).getDate();
  const today = new Date();
  const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

  document.getElementById('ganttPeriodLabel').textContent = `${GANTT_YEAR}-${String(GANTT_MONTH + 1).padStart(2, '0')}`;

  const monthStart = new Date(GANTT_YEAR, GANTT_MONTH, 1);
  const monthEnd = new Date(GANTT_YEAR, GANTT_MONTH + 1, 0, 23, 59, 59);

  let events = ALL.filter(e => {
    if (company && e.company !== company) return false;
    const start = e.period_start ? new Date(e.period_start) : null;
    const end = parseEventEndDate(e) || start;
    if (!start) return false;
    return start <= monthEnd && (end || start) >= monthStart;
  });

  const groups = {};
  events.forEach(e => {
    const key = groupBy === 'company' ? (e.company || '???????') : (e.category || '???????');
    if (!groups[key]) groups[key] = [];
    groups[key].push(e);
  });

  const cellW = 40;
  let html = '';

  // ????????썹땟戮녹??諭?? (????????誘⑦떟??)
  html += '<div style="display:flex">';
  html += `<div class="gantt-label" style="background:var(--brand-soft);font-weight:700;font-size:.7rem">Event</div>`;
  html += '<div class="gantt-cells" style="display:flex">';
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${GANTT_YEAR}-${String(GANTT_MONTH+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayOfWeek = new Date(GANTT_YEAR, GANTT_MONTH, d).getDay();
    const isToday = dateStr === todayStr;
    const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;
    let cls = 'gantt-header-cell';
    if (isToday) cls += ' today';
    html += `<div class="${cls}" style="min-width:${cellW}px;${isWeekend ? 'background:rgba(0,0,0,.03)' : ''}">${d}</div>`;
  }
  html += '</div></div>';

  const sortedGroups = Object.keys(groups).sort();
  for (const group of sortedGroups) {
    html += `<div class="gantt-group-header">${esc(group)} (${groups[group].length})</div>`;

    groups[group].sort((a,b) => new Date(a.period_start) - new Date(b.period_start)).forEach(e => {
      const start = new Date(e.period_start);
      const end = parseEventEndDate(e) || start;

      // ?????????????遺얘턁??????????????遺얘턁????????????濾?????????繹먮굝?????????熬곣뫖利당춯??쎾퐲??????????????
      const barStart = Math.max(1, start.getDate() + (start.getMonth() === GANTT_MONTH && start.getFullYear() === GANTT_YEAR ? 0 : (start < monthStart ? 1 - start.getDate() : 0)));
      const effectiveStart = start < monthStart ? 1 : start.getDate();
      const effectiveEnd = end > monthEnd ? daysInMonth : end.getDate();

      const leftPx = (effectiveStart - 1) * cellW;
      const widthPx = Math.max(cellW, (effectiveEnd - effectiveStart + 1) * cellW);

      const coClass = getCompanyGanttClass(e.company);
      const title = (e.title||'').substring(0, 30);

      html += `<div class="gantt-row">`;
      html += `<div class="gantt-label" title="${esc(e.title)}">${esc(title)}</div>`;
      html += `<div class="gantt-cells" style="position:relative;min-height:28px">`;
      // ??????꾩룆梨띰쭕?뚢뵾??????????ㅼ뒧?????????
      for (let d = 1; d <= daysInMonth; d++) {
        const dayOfWeek = new Date(GANTT_YEAR, GANTT_MONTH, d).getDay();
        const dateStr = `${GANTT_YEAR}-${String(GANTT_MONTH+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        let cls = 'gantt-cell';
        if (dateStr === todayStr) cls += ' today';
        if (dayOfWeek === 0 || dayOfWeek === 6) cls += ' weekend';
        html += `<div class="${cls}" style="min-width:${cellW}px"></div>`;
      }
      html += `<div class="gantt-bar ${coClass}" style="left:${leftPx}px;width:${widthPx}px" onclick="openDetail(${e.id})" title="${esc(e.company + ' - ' + e.title)}">${esc(title)}</div>`;
      html += `</div></div>`;
    });
  }

  if (!events.length) {
    html = '<p class="p-8 text-center text-slate-400">??????????????ㅳ늾?????????????留⑶뜮??????猷몄굡???????????? ??????嚥싲갭큔?????????????ㅼ굣塋?</p>';
  }

  document.getElementById('ganttChart').innerHTML = html;
}

function getCompanyGanttClass(company) {
  const value = String(company || '').toLowerCase();
  if (!value) return 'default';
  if (value.includes('samsung')) return 'samsung';
  if (value.includes('kb')) return 'kb';
  if (value.includes('hyundai')) return 'hyundai';
  return value.includes('shinhan') ? 'shinhan' : 'default';
}

// ?????嶺뚮ㅎ?볠꽴??????????????(HD/SS/KB/SH)
function coTag(c) {
  const value = String(c || '');
  const lower = value.toLowerCase();
  if (!value) return '?';
  if (lower.includes('kb')) return 'KB';
  if (lower.includes('hyundai')) return 'HD';
  return lower.includes('samsung') ? 'SS' : lower.includes('shinhan') ? 'SH' : value.substring(0, 2);
}

    } else {

function filterProducts() {
  const company = document.getElementById('prodFilterCompany')?.value || '';
  const type = document.getElementById('prodFilterType')?.value || '';
  const keyword = (document.getElementById('prodFilterKw')?.value || '').toLowerCase();
  const sortBy = document.getElementById('prodSortBy')?.value || 'name';

  let filtered = (window._ALL_PRODUCTS || []).filter(product => {
    if (company && product.company !== company) return false;
    if (type && product.card_type !== type) return false;
    if (keyword && !(product.card_name || '').toLowerCase().includes(keyword)) return false;
    return true;
  });

  if (sortBy === 'chunks') {
    filtered.sort((a, b) => (b.chunk_count || 0) - (a.chunk_count || 0));
  } else {
    filtered.sort((a, b) => (a.card_name || '').localeCompare(b.card_name || '', 'ko'));
  }

  const grid = document.getElementById('productGrid');
  const empty = document.getElementById('productEmpty');
  if (!grid || !empty) return;

  if (!filtered.length) {
    grid.innerHTML = '';
    empty.classList.remove('hidden');
    return;
  }

  empty.classList.add('hidden');
  grid.innerHTML = filtered.map(product => {
    const chunks = product.chunk_count || 0;
    const maxChunks = 20;
    const pct = Math.min(100, Math.round(chunks / maxChunks * 100));
    const payload = encodeURIComponent(JSON.stringify(product));
    return `<div class="product-card" onclick="openProductCard('${payload}')">
      <div class="flex items-center justify-between mb-2">
        <span class="${pillCls(product.company)} badge-sm">${coTag(product.company)}</span>
        <span class="text-[10px] text-slate-400">${product.card_type || ''}</span>
      </div>
      <h4 class="text-sm font-bold mb-1 truncate" title="${esc(product.card_name)}">${esc(product.card_name)}</h4>
      <div class="text-xs text-slate-500 mb-2">${product.annual_fee || '?고쉶鍮??뺣낫 ?놁쓬'}</div>
      <div class="benefit-bar">
        <div class="benefit-bar-fill" style="width:${pct}%;background:var(--brand)"></div>
      </div>
      <div class="text-[10px] text-slate-400 mt-1">${chunks}媛?泥?겕${product.sections ? ` / ${product.sections.length}媛??뱀뀡` : ''}</div>
    </div>`;
  }).join('');
}

function renderGantt() {
  const chart = document.getElementById('ganttChart');
  if (!chart) return;

  if (typeof ALL === 'undefined' || !ALL.length) {
    chart.innerHTML = '<p class="p-8 text-center text-slate-400">?대깽???곗씠?곕? 遺덈윭?ㅻ뒗 以묒엯?덈떎...</p>';
    return;
  }

  const company = document.getElementById('ganttFilterCompany')?.value || '';
  const groupBy = document.getElementById('ganttGroupBy')?.value || 'company';
  const daysInMonth = new Date(GANTT_YEAR, GANTT_MONTH + 1, 0).getDate();
  const today = new Date();
  const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
  document.getElementById('ganttPeriodLabel').textContent = `${GANTT_YEAR}-${String(GANTT_MONTH + 1).padStart(2, '0')}`;

  const monthStart = new Date(GANTT_YEAR, GANTT_MONTH, 1);
  const monthEnd = new Date(GANTT_YEAR, GANTT_MONTH + 1, 0, 23, 59, 59);
  const events = ALL.filter(e => {
    if (company && e.company !== company) return false;
    const start = e.period_start ? new Date(e.period_start) : null;
    const end = parseEventEndDate(e) || start;
    if (!start) return false;
    return start <= monthEnd && (end || start) >= monthStart;
  });

  const groups = {};
  events.forEach(e => {
    const key = groupBy === 'company' ? (e.company || '誘몃텇瑜?) : (e.category || '誘몃텇瑜?);
    if (!groups[key]) groups[key] = [];
    groups[key].push(e);
  });

  const cellW = 40;
  let html = '<div style="display:flex">';
  html += `<div class="gantt-label" style="background:var(--brand-soft);font-weight:700;font-size:.7rem">?대깽??/div>`;
  html += '<div class="gantt-cells" style="display:flex">';
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${GANTT_YEAR}-${String(GANTT_MONTH + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const dayOfWeek = new Date(GANTT_YEAR, GANTT_MONTH, d).getDay();
    const isToday = dateStr === todayStr;
    const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;
    let cls = 'gantt-header-cell';
    if (isToday) cls += ' today';
    html += `<div class="${cls}" style="min-width:${cellW}px;${isWeekend ? 'background:rgba(0,0,0,.03)' : ''}">${d}</div>`;
  }
  html += '</div></div>';

  Object.keys(groups).sort().forEach(group => {
    html += `<div class="gantt-group-header">${esc(group)} (${groups[group].length})</div>`;
    groups[group].sort((a, b) => new Date(a.period_start) - new Date(b.period_start)).forEach(e => {
      const start = new Date(e.period_start);
      const end = parseEventEndDate(e) || start;
      const effectiveStart = start < monthStart ? 1 : start.getDate();
      const effectiveEnd = end > monthEnd ? daysInMonth : end.getDate();
      const leftPx = (effectiveStart - 1) * cellW;
      const widthPx = Math.max(cellW, (effectiveEnd - effectiveStart + 1) * cellW);
      const title = (e.title || '').substring(0, 30);
      const coClass = getCompanyGanttClass(e.company);

      html += `<div class="gantt-row">`;
      html += `<div class="gantt-label" title="${esc(e.title)}">${esc(title)}</div>`;
      html += `<div class="gantt-cells" style="position:relative;min-height:28px">`;
      for (let d = 1; d <= daysInMonth; d++) {
        const dayOfWeek = new Date(GANTT_YEAR, GANTT_MONTH, d).getDay();
        const dateStr = `${GANTT_YEAR}-${String(GANTT_MONTH + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        let cls = 'gantt-cell';
        if (dateStr === todayStr) cls += ' today';
        if (dayOfWeek === 0 || dayOfWeek === 6) cls += ' weekend';
        html += `<div class="${cls}" style="min-width:${cellW}px"></div>`;
      }
      html += `<div class="gantt-bar ${coClass}" style="left:${leftPx}px;width:${widthPx}px" onclick="openDetail(${e.id})" title="${esc(e.company + ' - ' + e.title)}">${esc(title)}</div>`;
      html += `</div></div>`;
    });

let DISCLOSURE_SYNC_POLL_TIMER = null;
let DISCLOSURE_SYNC_LAST_REFRESH_KEY = '';

function formatDisclosureSyncTime(value) {
  if (!value) return '-';
  const date = new Date(value);
  return Number.isNaN(date.getTime()) ? value : date.toLocaleString('ko-KR');
}

function getDisclosureSyncTone(state) {
  if (state === 'running') {
    return {
      pill: 'border-blue-200 bg-blue-50 text-blue-700',
      card: 'border-blue-200 bg-blue-50',
      icon: 'fa-spinner fa-spin text-blue-600',
      label: '吏꾪뻾 以?,
    };
  }
  if (state === 'success') {
    return {
      pill: 'border-emerald-200 bg-emerald-50 text-emerald-700',
      card: 'border-emerald-200 bg-emerald-50',
      icon: 'fa-check-circle text-emerald-600',
      label: '?꾨즺',
    };
  }
  if (state === 'error') {
    return {
      pill: 'border-rose-200 bg-rose-50 text-rose-700',
      card: 'border-rose-200 bg-rose-50',
      icon: 'fa-triangle-exclamation text-rose-600',
      label: '?ㅽ뙣',
    };
  }
  return {
    pill: 'border-slate-200 bg-white text-slate-600',
    card: 'border-slate-200 bg-white',
    icon: 'fa-clock text-slate-400',
    label: '?湲?,
  };
}

function stopDisclosureSyncPolling() {
  if (DISCLOSURE_SYNC_POLL_TIMER) {
    clearInterval(DISCLOSURE_SYNC_POLL_TIMER);
    DISCLOSURE_SYNC_POLL_TIMER = null;
  }
}

function ensureDisclosureSyncPolling() {
  if (DISCLOSURE_SYNC_POLL_TIMER) return;
  DISCLOSURE_SYNC_POLL_TIMER = setInterval(() => {
    loadDisclosureSyncStatus({ silent: true });
  }, 3000);
}

function renderDisclosureSyncStatus(status = {}) {
  const headlineEl = document.getElementById('disclosureSyncHeadline');
  const metaEl = document.getElementById('disclosureSyncMeta');
  const pillEl = document.getElementById('disclosureSyncStatePill');
  const stagesEl = document.getElementById('disclosureSyncStages');
  const btn = document.getElementById('btnDisclosureScrape');
  const filter = document.getElementById('disclosureCompanyFilter');
  if (!headlineEl || !metaEl || !pillEl || !stagesEl) return;

  const tone = getDisclosureSyncTone(status.state);
  const scopeLabel = status.company ? `${status.company} 湲곗?` : '?꾩껜 移대뱶??湲곗?';
  const currentStage = (status.stages || []).find((stage) => stage.key === status.current_stage);
  headlineEl.textContent = currentStage?.label || status.message || '怨듭떆 ?숆린???곹깭瑜??뺤씤?섏꽭??';
  metaEl.textContent = `${scopeLabel} 쨌 ?쒖옉 ${formatDisclosureSyncTime(status.started_at)}${status.finished_at ? ` 쨌 ?꾨즺 ${formatDisclosureSyncTime(status.finished_at)}` : ''} 쨌 ${status.message || '?湲?以묒엯?덈떎.'}`;
  pillEl.className = `inline-flex items-center rounded-full border px-3 py-1 text-[11px] font-semibold ${tone.pill}`;
  pillEl.textContent = tone.label;

  const stages = Array.isArray(status.stages) && status.stages.length ? status.stages : [];
  stagesEl.innerHTML = stages.map((stage, index) => {
    const stageTone = getDisclosureSyncTone(stage.state);
    const startedAt = stage.started_at ? `?쒖옉 ${formatDisclosureSyncTime(stage.started_at)}` : '?꾩쭅 ?쒖옉 ??;
    const finishedAt = stage.finished_at ? ` 쨌 ?꾨즺 ${formatDisclosureSyncTime(stage.finished_at)}` : '';
    return `
      <div class="rounded-xl border px-3 py-3 ${stageTone.card}">
        <div class="flex items-start justify-between gap-3">
          <div class="min-w-0">
            <div class="text-[11px] font-semibold tracking-[0.08em] text-slate-500">STEP ${index + 1}</div>
            <div class="mt-1 text-sm font-semibold text-slate-800">${stage.label}</div>
            <p class="mt-1 text-xs text-slate-500">${stage.message || '?湲?以?}</p>
            <div class="mt-2 text-[11px] text-slate-400">${startedAt}${finishedAt}</div>
          </div>
          <i class="fas ${stageTone.icon} mt-0.5"></i>
        </div>
      </div>
    `;
  }).join('');

  if (btn) {
    const isBusy = Boolean(status.active);
    btn.disabled = isBusy;
    btn.classList.toggle('opacity-70', isBusy);
    btn.classList.toggle('cursor-not-allowed', isBusy);
    btn.innerHTML = isBusy
      ? '<i class="fas fa-spinner fa-spin mr-1"></i>?숆린??吏꾪뻾 以?..'
      : '<i class="fas fa-satellite-dish mr-1"></i>怨듭떆 ?숆린???쒖옉';
  }
  if (filter) filter.disabled = Boolean(status.active);
}

async function refreshAfterDisclosureSync(status) {
  const refreshKey = `${status.run_id || 'none'}:${status.state || 'idle'}:${status.finished_at || ''}`;
  if (status.state !== 'success' || DISCLOSURE_SYNC_LAST_REFRESH_KEY === refreshKey) return;
  DISCLOSURE_SYNC_LAST_REFRESH_KEY = refreshKey;

  const shouldRefreshProducts = Boolean(window._PRODUCTS_LOADED || !document.getElementById('tab-products')?.classList.contains('hidden'));
  window.WEEKLY_DISCLOSURE_PRODUCTS = null;
  window._ALL_PRODUCTS = [];
  window._PRODUCTS_LOADED = false;

  await Promise.allSettled([
    loadOpsOverviewData(),
    loadDisclosureStats(),
    typeof loadAll === 'function' ? loadAll() : Promise.resolve(),
  ]);

  if (shouldRefreshProducts && typeof loadProductsTab === 'function') {
    await loadProductsTab();
    window._PRODUCTS_LOADED = true;
  }
}

async function loadDisclosureSyncStatus({ silent = false } = {}) {
  try {
    const response = await fetch('/api/disclosures/sync-status');
    const status = response.ok ? await response.json() : {};
    renderDisclosureSyncStatus(status);

    if (status.active || status.state === 'running') {
      ensureDisclosureSyncPolling();
    } else {
      stopDisclosureSyncPolling();
      await refreshAfterDisclosureSync(status);
    }
    return status;
  } catch (e) {
    if (!silent) console.error('disclosure sync status fail', e);
    return null;
  }
}

async function startDisclosureScrape() {
  const company = document.getElementById('disclosureCompanyFilter')?.value || '';
  const btn = document.getElementById('btnDisclosureScrape');
  if (!btn) return;

  if (!confirm(`怨듭떆 ?숆린?붾? ?쒖옉?좉퉴??${company ? ` (${company})` : ''}\n?좉퇋 怨듭떆 ?섏쭛 ???꾨쿋??RAG? ?ъ씠??諛섏쁺源뚯? ?쒖감 ?ㅽ뻾?⑸땲??`)) return;

  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i>?쒖옉 以?..';
  try {
    const url = company ? `/api/disclosures/scrape?company=${encodeURIComponent(company)}` : '/api/disclosures/scrape';
    const r = await fetch(url, { method: 'POST' });
    const d = await r.json().catch(() => ({}));
    if (r.status === 409) {
      renderDisclosureSyncStatus(d);
      ensureDisclosureSyncPolling();
      return;
    }
    if (!r.ok) throw new Error(d.message || d.error || '怨듭떆 ?숆린?붾? ?쒖옉?????놁뒿?덈떎.');
    renderDisclosureSyncStatus(d);
    ensureDisclosureSyncPolling();
    await loadDisclosureSyncStatus({ silent: true });
  } catch (e) {
    alert('?ㅽ뙣: ' + e.message);
    await loadDisclosureSyncStatus({ silent: true });
  } finally {
    const latest = await loadDisclosureSyncStatus({ silent: true });
    if (!latest?.active) {
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-satellite-dish mr-1"></i>怨듭떆 ?숆린???쒖옉';
    }
  }
}
